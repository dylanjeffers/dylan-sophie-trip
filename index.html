<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbf7f2">
<title>Dylan &amp; Sophie · Spain + Nice</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
:root{--bg:#fbf7f2;--ink:#2b2420;--mute:#7a6e66;--line:#e8dfd5;--acc:#c4532d;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
header h1{font-size:19px;margin:0;letter-spacing:-.2px}header p{margin:1px 0 0;color:var(--mute);font-size:13px}
header .t{flex:1;min-width:0}
#add{border:0;background:var(--acc);color:#fff;font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
#chips{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chip .now{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2fa36b;margin-right:5px;vertical-align:1px}
#map{min-height:0}
#panel{max-height:42dvh;overflow-y:auto;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom) + 16px)}
@media(min-width:900px){#app{grid-template-columns:1fr 400px;grid-template-rows:auto auto 1fr}header,#chips{grid-column:1/3}#map{grid-row:3}#panel{grid-row:3;grid-column:2;max-height:none;border-top:0;border-left:1px solid var(--line)}}
.dh{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}.dh h2{font-size:17px;margin:0}.dh span{color:var(--mute);font-size:13px}
.strip{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px}.strip img{flex:none;width:76px;height:76px;object-fit:cover;border-radius:8px;cursor:pointer;background:#eee}
.st{display:grid;grid-template-columns:46px 26px 1fr;gap:4px 8px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.st .tm{color:var(--mute);font-size:13px;padding-top:2px}.st .ic{width:24px;height:24px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px}
.st b{font-weight:600}.st .ar{color:var(--mute);font-size:13px}.st .nt{grid-column:3;font-size:13px;color:#4a403a}
.dc{padding:10px 0;border-top:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center}.dc .l{width:72px;font-weight:600;font-size:13px}.dc .c{flex:1}.dc .c div{color:var(--mute);font-size:13px}.dc .n{color:var(--acc);font-size:12px;white-space:nowrap}
.pin{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;font:600 12px/1 -apple-system,sans-serif}
.pin.sm{width:14px;height:14px;font-size:0}
.ph{width:46px;height:46px;border-radius:9px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);overflow:hidden;background:#ddd}.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph.ap{border-style:dashed}
.pclu{position:relative}.pclu img{width:52px;height:52px;border-radius:10px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);object-fit:cover}.pclu b{position:absolute;top:-6px;right:-6px;background:var(--acc);color:#fff;border-radius:999px;font-size:12px;padding:2px 7px;border:2px solid #fff}
.leaflet-popup-content{margin:10px 12px;font-size:14px}.leaflet-popup-content .ar{color:var(--mute);font-size:12px}
#viewer{position:fixed;inset:0;background:rgba(15,12,10,.94);z-index:2000;display:flex;flex-direction:column;color:#fff}
#viewer[hidden]{display:none}#viewer .img{flex:1;display:grid;place-items:center;min-height:0;position:relative}#viewer .img img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .bar{padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);font-size:14px}#viewer .bar .m{color:#c9bfb6;font-size:13px;margin-top:3px}
#viewer .x,#viewer .nv{position:absolute;background:rgba(0,0,0,.45);border:0;color:#fff;border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer}
#viewer .x{top:calc(env(safe-area-inset-top) + 10px);right:12px}#viewer .pv{left:10px;top:50%}#viewer .nx{right:10px;top:50%}
#viewer .ed{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}#viewer .ed button{background:#3a322c;border:0;color:#fff;border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:3000;max-width:90vw;text-align:center}
.empty{color:var(--mute);font-size:13px;margin:6px 0 10px}
</style>
</head>
<body>
<div id="app">
<header><div class="t"><h1>Dylan &amp; Sophie</h1><p id="sub">Spain + Nice · Nov 14–29, 2026</p></div><button id="add">＋ Photos</button></header>
<nav id="chips"></nav>
<div id="map"></div>
<section id="panel"></section>
</div>
<div id="viewer" hidden><div class="img"><img alt=""><button class="nv pv" aria-label="Previous">‹</button><button class="nv nx" aria-label="Next">›</button><button class="x" aria-label="Close">✕</button></div><div class="bar"><div class="cp"></div><div class="m"></div><div class="ed" hidden><button data-a="cap">Edit caption</button><button data-a="move">Move pin</button><button data-a="del">Delete</button></div></div></div>
<div id="toast" hidden></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script type="module">
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K={food:['#d0662a','🍽'],coffee:['#a8742a','☕'],sight:['#2f6fd0','★'],culture:['#2f6fd0','★'],art:['#8a4fd0','🎨'],history:['#8a6a3a','🏛'],view:['#16938a','🌅'],night:['#4b4fb0','🍸'],stay:['#2e8b57','🛏'],flight:['#6b7280','✈'],info:['#6b7280','🚗'],shop:['#c84f86','🛍'],sport:['#d03a3a','⚽']};
const kc=k=>(K[k]||K.info);
let D={days:[],stops:[]},P=[],cur='all',vi=[],vix=0;

const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([40,0],5);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const routeL=L.layerGroup().addTo(map),stopL=L.layerGroup().addTo(map);
const photoL=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:45,spiderfyOnMaxZoom:false,zoomToBoundsOnClick:false,
  iconCreateFunction:c=>{const m=c.getAllChildMarkers().map(x=>x.options.p).sort((a,b)=>b.taken.localeCompare(a.taken));return L.divIcon({className:'pclu',html:`<img src="${esc(m[0].thumb)}"><b>${m.length}</b>`,iconSize:[52,52],iconAnchor:[26,26]})}}).addTo(map);
photoL.on('clusterclick',e=>{const ms=e.layer.getAllChildMarkers(),b=e.layer.getBounds();if(map.getZoom()>=17||b.getNorthEast().distanceTo(b.getSouthWest())<80){openViewer(ms.map(m=>m.options.p).sort((a,b)=>a.taken.localeCompare(b.taken)),0)}else e.layer.zoomToBounds({padding:[40,40]})});

const pass=()=>localStorage.getItem('tp')||'';const who=()=>localStorage.getItem('tw')||'';
function toast(t,ms){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>el.hidden=true,ms)}
const dayIds=()=>D.days.map(d=>d.id).sort();
function chipFor(date){let c=null;for(const id of dayIds()){if(id<=date)c=id}return c&&date<='2026-11-30'?c:null}
function madridToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
const fmtT=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return`${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`};
function fmtTaken(s){if(!s)return'';const d=new Date(s.slice(0,10)+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+(s.length>10?' · '+fmtT(s.slice(11,16)):'')}
const stopsFor=d=>D.stops.filter(s=>d==='all'||s.day===d).sort((a,b)=>a.day.localeCompare(b.day)||a.sort-b.sort);
const photosFor=d=>P.filter(p=>d==='all'||chipFor(p.taken.slice(0,10))===d);

function chips(){const today=madridToday(),tc=chipFor(today);
  $('#chips').innerHTML=[`<button class="chip${cur==='all'?' on':''}" data-d="all">Whole trip</button>`].concat(D.days.map(d=>`<button class="chip${cur===d.id?' on':''}" data-d="${d.id}">${d.id===tc?'<span class="now"></span>':''}${esc(d.label)}</button>`)).join('');
  $('#chips').querySelector('.on')?.scrollIntoView({inline:'center',block:'nearest'})}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b)select(b.dataset.d,true)};

function render(fit){
  stopL.clearLayers();routeL.clearLayers();photoL.clearLayers();
  const ss=stopsFor(cur),ps=photosFor(cur),pts=[];let n=0;
  const line=ss.filter(s=>s.lat!=null&&(cur!=='all'||s.kind!=='info'));
  if(line.length>1)L.polyline(line.map(s=>[s.lat,s.lng]),{color:'#c4532d',weight:cur==='all'?2:3,opacity:.55,dashArray:'6 6'}).addTo(routeL);
  for(const s of ss){if(s.lat==null)continue;n++;const[c,ic]=kc(s.kind);const all=cur==='all';
    const m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:`<div class="pin${all?' sm':''}" style="background:${c}">${all?'':n}</div>`,iconSize:all?[14,14]:[26,26],iconAnchor:all?[7,7]:[13,13]}),zIndexOffset:all?0:500});
    m.bindPopup(`<b>${esc(s.title)}</b><div class="ar">${s.time?fmtT(s.time)+' · ':''}${esc(s.area)}</div>${s.note?`<div style="margin-top:4px">${esc(s.note)}</div>`:''}`);m.addTo(stopL);s._m=m;pts.push([s.lat,s.lng])}
  for(const p of ps){if(p.lat==null)continue;const m=L.marker([p.lat,p.lng],{p,icon:L.divIcon({className:'',html:`<div class="ph${p.approx?' ap':''}"><img src="${esc(p.thumb)}" loading="lazy"></div>`,iconSize:[46,46],iconAnchor:[23,23]})});
    m.on('click',()=>{const list=photosFor(cur);openViewer(list,list.indexOf(p))});photoL.addLayer(m);pts.push([p.lat,p.lng])}
  if(fit&&pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:15});
  panel()}

function panel(){const el=$('#panel');
  if(cur==='all'){const tc=chipFor(madridToday());
    el.innerHTML=`<div class="dh"><h2>The trip</h2><span>${P.length} photo${P.length===1?'':'s'} so far</span></div>`+(P.length?`<div class="strip">${P.slice(-24).reverse().map(p=>`<img src="${esc(p.thumb)}" data-p="${p.id}" loading="lazy">`).join('')}</div>`:'')+
    D.days.map(d=>{const c=photosFor(d.id).length;return`<div class="dc" data-d="${d.id}"><div class="l">${d.id===tc?'<span class="now" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#2fa36b;margin-right:5px"></span>':''}${esc(d.label)}</div><div class="c"><b>${esc(d.city)}</b><div>${esc(d.summary)}</div></div>${c?`<div class="n">${c} 📷</div>`:''}</div>`}).join('');return}
  const d=D.days.find(x=>x.id===cur),ps=photosFor(cur);let n=0;
  el.innerHTML=`<div class="dh"><h2>${esc(d.city)}</h2><span>${esc(d.label)}</span></div>`+
   (ps.length?`<div class="strip">${ps.map(p=>`<img src="${esc(p.thumb)}" data-p="${p.id}" loading="lazy">`).join('')}</div>`:`<div class="empty">No photos from this day yet.</div>`)+
   stopsFor(cur).map(s=>{const[c,ic]=kc(s.kind);const num=s.lat!=null?++n:'';return`<div class="st" data-s="${s.id}"><div class="tm">${fmtT(s.time)}</div><div class="ic" style="background:${c}">${num||ic}</div><div><b>${esc(s.title)}</b> <span class="ar">${esc(s.area)}</span></div>${s.note?`<div class="nt">${esc(s.note)}</div>`:''}</div>`}).join('')}
$('#panel').onclick=e=>{const dc=e.target.closest('.dc');if(dc)return select(dc.dataset.d,true);
  const im=e.target.closest('img[data-p]');if(im){const list=cur==='all'?P.slice(-24).reverse():photosFor(cur);return openViewer(list,list.findIndex(p=>p.id===im.dataset.p))}
  const st=e.target.closest('.st');if(st){const s=D.stops.find(x=>x.id===st.dataset.s);if(s?._m){map.flyTo(s._m.getLatLng(),Math.max(map.getZoom(),15));s._m.openPopup()}}};

function select(d,fit){cur=d;history.replaceState(null,'',d==='all'?location.pathname:'#'+d);chips();render(fit);$('#panel').scrollTop=0}

function nearestStopName(p){if(p.lat==null)return'';let best=null,bd=1e9;for(const s of D.stops){if(s.lat==null)continue;const dd=map.distance([p.lat,p.lng],[s.lat,s.lng]);if(dd<bd){bd=dd;best=s}}return best&&bd<400?best.title:''}
function openViewer(list,i){if(!list.length)return;vi=list;vix=Math.max(0,i);showV();$('#viewer').hidden=false}
function showV(){const p=vi[vix];$('#viewer img').src=p.full;$('#viewer .cp').textContent=p.caption||'';
  const near=nearestStopName(p);$('#viewer .m').textContent=[fmtTaken(p.taken),near,p.by?'by '+p.by:'',p.approx?'location approximate':''].filter(Boolean).join(' · ');
  $('#viewer .ed').hidden=!pass();$('#viewer .pv').style.visibility=vix>0?'visible':'hidden';$('#viewer .nx').style.visibility=vix<vi.length-1?'visible':'hidden'}
$('#viewer .x').onclick=()=>$('#viewer').hidden=true;$('#viewer .pv').onclick=()=>{if(vix>0){vix--;showV()}};$('#viewer .nx').onclick=()=>{if(vix<vi.length-1){vix++;showV()}};
document.addEventListener('keydown',e=>{if($('#viewer').hidden)return;if(e.key==='Escape')$('#viewer').hidden=true;if(e.key==='ArrowLeft')$('#viewer .pv').click();if(e.key==='ArrowRight')$('#viewer .nx').click()});
let tx=null;$('#viewer .img').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});$('#viewer .img').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(dx>50)$('#viewer .pv').click();else if(dx<-50)$('#viewer .nx').click()});
$('#viewer .ed').onclick=async e=>{const a=e.target.dataset.a;if(!a)return;const p=vi[vix];
  if(a==='cap'){const c=prompt('Caption',p.caption||'');if(c===null)return;await saveMeta({...p,caption:c.trim()});toast('Saved',1500);await refresh(false);showV()}
  if(a==='move'){$('#viewer').hidden=true;toast('Tap the map where this photo was taken');map.once('click',async ev=>{await saveMeta({...p,lat:+ev.latlng.lat.toFixed(6),lng:+ev.latlng.lng.toFixed(6),approx:false});toast('Moved',1500);await refresh(false)})}
  if(a==='del'){if(!confirm('Delete this photo for everyone?'))return;const r=await fetch('/api/photos?id='+p.id,{method:'DELETE',headers:{'x-passcode':pass()}});if(!r.ok)return toast('Could not delete ('+r.status+')',2500);$('#viewer').hidden=true;toast('Deleted',1500);await refresh(false)}};

async function saveMeta(m){const r=await fetch('/api/photos',{method:'POST',headers:{'x-passcode':pass(),'content-type':'application/json'},body:JSON.stringify(m)});if(!r.ok){const e=new Error('meta '+r.status);e.status=r.status;throw e}}
async function putImg(blob,kind,id){const r=await fetch(`/api/upload?id=${id}&kind=${kind}`,{method:'POST',headers:{'x-passcode':pass(),'content-type':'application/octet-stream'},body:blob});if(!r.ok){const e=new Error('upload '+r.status);e.status=r.status;throw e}return(await r.json()).url}
async function toJpeg(f,max,q){const u=URL.createObjectURL(f);try{const img=new Image();img.src=u;await img.decode();const w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));return{b,w:c.width,h:c.height}}finally{URL.revokeObjectURL(u)}}
const pad=n=>String(n).padStart(2,'0');const localISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
function guess(taken){const date=taken.slice(0,10),day=chipFor(date);if(!day)return null;
  const same=D.stops.filter(s=>s.lat!=null&&s.day===day&&s.kind!=='flight');if(!same.length)return null;
  const timed=same.filter(s=>s.time);if(timed.length&&day===date){const t=mins(taken.slice(11,16));timed.sort((a,b)=>Math.abs(mins(a.time)-t)-Math.abs(mins(b.time)-t));return timed[0]}
  return same[0]}
let exifr=null;async function loadExifr(){if(!exifr)exifr=(await import('https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.esm.mjs')).default;return exifr}
async function uploadOne(f){const ex=await loadExifr();let tags={},gps=null;
  try{tags=await ex.parse(f,['DateTimeOriginal','CreateDate'])||{}}catch{}try{gps=await ex.gps(f)}catch{}
  const dt=tags.DateTimeOriginal||tags.CreateDate;const taken=localISO(dt instanceof Date&&!isNaN(dt)?dt:new Date(f.lastModified||Date.now()));
  let full=await toJpeg(f,2048,.82);if(full.b.size>4e6)full=await toJpeg(f,1600,.72);const th=await toJpeg(f,400,.75);
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const fu=await putImg(full.b,'full',id),tu=await putImg(th.b,'thumb',id);
  let lat=null,lng=null,approx=false;if(gps&&isFinite(gps.latitude)&&isFinite(gps.longitude)&&(gps.latitude||gps.longitude)){lat=+gps.latitude.toFixed(6);lng=+gps.longitude.toFixed(6)}else{const g=guess(taken);if(g){lat=g.lat;lng=g.lng;approx=true}}
  await saveMeta({id,full:fu,thumb:tu,w:full.w,h:full.h,taken,lat,lng,approx,caption:'',by:who(),added:new Date().toISOString()});return approx}
$('#add').onclick=()=>{if(!pass()){const p=prompt('Upload passcode (Dylan and Sophie only)');if(!p)return;localStorage.setItem('tp',p.trim())}
  if(!localStorage.getItem('tw')){const w=prompt('Your name, shown on your photos','');localStorage.setItem('tw',(w||'').trim())}$('#file').click()};
$('#file').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;let ok=0,ap=0;
  for(const[i,f]of fs.entries()){toast(`Uploading ${i+1} of ${fs.length}…`);try{if(await uploadOne(f))ap++;ok++}catch(err){console.error(err);if(err.status===401){localStorage.removeItem('tp');toast('Wrong passcode. Tap ＋ Photos to try again.',4000);break}}}
  if(ok){toast(`${ok} photo${ok===1?'':'s'} added`+(ap?` (${ap} placed at the nearest planned stop; open one and tap Move pin to fix)`:''),5000);await refresh(true)}
  else if(pass())toast('Upload failed. Check your connection and try again.',4000)};

async function refresh(fit){try{const r=await fetch('/api/photos?ts='+Date.now());if(r.ok){P=(await r.json()).sort((a,b)=>a.taken.localeCompare(b.taken))}}catch{}render(fit)}
async function init(){D=await fetch('/stops.json?ts='+Date.now()).then(r=>r.json());
  const h=location.hash.slice(1),tc=chipFor(madridToday());cur=D.days.some(d=>d.id===h)?h:(tc&&madridToday()>='2026-11-15'?tc:'all');
  chips();await refresh(true);setInterval(async()=>{if(document.visibilityState!=='visible'||!$('#viewer').hidden)return;const before=P.map(p=>p.id+p.lat+p.caption).join();try{const r=await fetch('/api/photos?ts='+Date.now());if(!r.ok)return;const np=(await r.json()).sort((a,b)=>a.taken.localeCompare(b.taken));if(np.map(p=>p.id+p.lat+p.caption).join()!==before){P=np;render(false)}}catch{}},60000)}
init();
</script>
</body>
</html>
